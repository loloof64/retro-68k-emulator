name: Build & Release (Tauri)

# Triggers:
# - Push a tag like "v0.1.0" -> builds all 3 platforms and publishes a GitHub Release with installers attached
#   (plus a portable .zip for Windows and the user guide PDF)
# - Manual run from the Actions tab -> builds all 3 platforms but does NOT publish
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Creates the draft release once, before the parallel platform builds.
  # Without this, each build-tauri job creates its own draft for the same tag
  # (race), and the assets end up split across several drafts.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create the draft release (on tag)
        id: create
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name='${{ github.ref_name }}' \
            -f name='${{ github.ref_name }}' \
            -f body='Memory inspector now shows 24 rows instead of 16, the find bar pre-fills from your selection, and the default window is a bit taller. See CHANGELOG.md for details on this release.' \
            -F draft=true -F prerelease=false --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-alsa patchelf

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and (on tag) publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Set on tag pushes: attach to the draft made by create-release.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          # Only actually create/publish a GitHub Release when triggered by a tag push.
          # Manual "workflow_dispatch" runs just build and upload the artifacts below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Portable Windows build: the .exe (plus any .dll the build left next to
      # it) in a folder, zipped, no installer needed. The C runtime is linked
      # statically (src-tauri/.cargo/config.toml) and Tauri links the WebView2
      # loader into the .exe, so normally there are no DLLs to add; the copy
      # below only guards against a future dependency adding one. WebView2 itself
      # ships with Windows 10/11.
      - name: Package portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $release = 'src-tauri/target/release'
          $stage = 'portable/Retro68K-Emulator'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$release/retro-68k-emulator.exe" "$stage/Retro68K-Emulator.exe"
          Copy-Item "$release/*.dll" $stage -ErrorAction SilentlyContinue
          Get-ChildItem $stage
          # A branch name may contain "/" (manual runs), which is not valid in a file name.
          $ref = '${{ github.ref_name }}'.Replace('/', '-')
          Compress-Archive -Path 'portable/Retro68K-Emulator' -DestinationPath "Retro68K-Emulator-$ref-windows-portable.zip"

      - name: Attach portable zip to the draft release (on tag)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: Retro68K-Emulator-*-windows-portable.zip

      - name: Upload portable zip (manual runs)
        if: matrix.platform == 'windows-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows
          path: Retro68K-Emulator-*-windows-portable.zip

      - name: Upload build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/rpm/*.rpm
          if-no-files-found: ignore

  # End-user documentation (docs/user) as a PDF, attached to the same draft release.
  # Runs after the platform builds so tauri-action has already created the draft
  # (avoids two jobs racing to create duplicate drafts for the same tag).
  user-guide-pdf:
    needs: build-tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pip rather than apt: apt's WeasyPrint is an old 53.x that hung on the
      # user guide in CI; 67.x is what the docs are developed against.
      - name: Install WeasyPrint
        run: pip install 'weasyprint==67.0'

      - name: Install frontend dependencies
        run: npm ci

      # Chrome for mermaid-cli (diagram -> PNG); without it the diagram falls
      # back to a plain code block. --no-sandbox: Ubuntu 24.04 runners restrict
      # unprivileged user namespaces, which Chrome's sandbox needs.
      - name: Install Chrome for Mermaid diagrams
        run: |
          npx puppeteer browsers install chrome-headless-shell
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"

      - name: Generate user guide PDF
        run: npm run docs:pdf:user
        env:
          MERMAID_PUPPETEER_CONFIG: ${{ runner.temp }}/puppeteer.json

      - name: Attach user guide PDF to the draft release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist-docs/Retro68K-User-Guide.pdf

      - name: Upload user guide PDF (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: user-guide-pdf
          path: dist-docs/Retro68K-User-Guide.pdf

      # Keeps the repo copy linked from README.md (docs/user/Retro68K-User-Guide.pdf)
      # in sync with every release, not just the release's own PDF asset.
      - name: Commit regenerated PDF to main (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp dist-docs/Retro68K-User-Guide.pdf docs/user/Retro68K-User-Guide.pdf
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/user/Retro68K-User-Guide.pdf
          if git diff --cached --quiet; then
            echo "No change in the generated PDF, nothing to commit."
          else
            git commit -m 'docs(user): regenerate user guide PDF'
            git push origin HEAD:main
          fi
